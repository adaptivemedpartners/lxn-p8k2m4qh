<!doctype html>
<html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Share Your Photos · December 18</title><meta name="robots" content="noindex"/>
<link rel="manifest" href="manifest.webmanifest"/><meta name="theme-color" content="#b88996"/><meta name="apple-mobile-web-app-capable" content="yes"/><link rel="apple-touch-icon" href="assets/vow-icon-192.png"/>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Great+Vibes&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet"/>
<style>
:root{--blush:#f6e8ec;--rose:#d4b0ba;--dusty:#b88996;--ink:#3d3336;--muted:#7a6a6e;--cream:#fbf7f2;--gold:#b8a07a;--card:#fffdfb;--line:rgba(184,160,122,.35)}
*{box-sizing:border-box}body{margin:0;font-family:Nunito,system-ui,sans-serif;color:var(--ink);background:linear-gradient(var(--cream),var(--blush));min-height:100vh}
.wrap{max-width:820px;margin:0 auto;padding:20px 14px 60px}a.back{color:var(--dusty);font-size:.9rem}
h1{font-family:"Great Vibes",cursive;font-weight:400;font-size:clamp(2.4rem,10vw,3.6rem);text-align:center;margin:8px 0 0;color:var(--dusty)}
.sub{text-align:center;font-family:"Cormorant Garamond",serif;font-size:1.25rem;color:var(--muted);margin:0 0 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;text-align:center}
.big{display:block;width:100%;font:inherit;font-size:1.3rem;font-weight:700;padding:18px;border:0;border-radius:16px;background:var(--dusty);color:#fff;cursor:pointer;box-shadow:0 4px 14px rgba(184,137,150,.35)}
.name{font:inherit;width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--rose);margin:0 0 12px;text-align:center}
.prog{height:12px;background:var(--blush);border-radius:99px;overflow:hidden;margin-top:14px}.prog>div{height:100%;width:0;background:var(--dusty);transition:width .2s}
.msg{margin-top:10px;min-height:1.3em;color:var(--muted)}.thanks{font-family:"Great Vibes",cursive;font-size:2rem;color:var(--dusty)}
h2{font-family:"Cormorant Garamond",serif;font-weight:600;text-align:center;margin:26px 0 10px;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:6px}
.ph{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;background:var(--blush);cursor:pointer}.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph.hid img{opacity:.3}.ph button{position:absolute;bottom:4px;right:4px;font:inherit;font-size:.7rem;border:0;border-radius:99px;padding:3px 8px;background:#fffc;cursor:pointer}
.ph .by{position:absolute;left:4px;bottom:4px;font-size:.65rem;background:#fffc;border-radius:99px;padding:1px 6px}
.lb{position:fixed;inset:0;background:rgba(30,20,24,.92);display:none;align-items:center;justify-content:center;z-index:9;flex-direction:column}.lb img{max-width:96vw;max-height:86vh;border-radius:8px}.lb p{color:#fff;margin:8px}
.tools{text-align:center;margin-top:30px}.tools button,.tools input{font:inherit;border:1px solid var(--gold);background:var(--card);border-radius:99px;padding:6px 14px}
.tabs{display:flex;gap:6px;justify-content:center;margin:0 0 14px}.tabs button{font:inherit;font-weight:700;border:1px solid var(--dusty);background:var(--card);color:var(--dusty);border-radius:99px;padding:8px 22px;cursor:pointer}.tabs button.on{background:var(--dusty);color:#fff}
.cam{position:relative;background:#000;border-radius:18px;overflow:hidden;aspect-ratio:3/4;max-height:68vh;margin:0 auto 10px}.cam video{width:100%;height:100%;object-fit:cover;display:block}.cam.mirror video{transform:scaleX(-1)}
.shut{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);width:76px;height:76px;border-radius:50%;border:5px solid #fff;background:rgba(255,255,255,.35);cursor:pointer}.shut:active{background:#fff}
.cb{position:absolute;bottom:28px;width:50px;height:50px;border-radius:50%;border:0;background:rgba(0,0,0,.45);color:#fff;font-size:1.4rem;cursor:pointer}.cb.flip{right:18px}.cb.torch{left:18px}.cb.on{background:#f5d76e;color:#000}
.flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;transition:opacity .25s}
.qstat{position:absolute;top:10px;right:10px;background:rgba(0,0,0,.5);color:#fff;border-radius:99px;padding:4px 12px;font-size:.85rem}
.camname{position:absolute;top:10px;left:10px;right:calc(10px + 9.5em)}.qstat{max-width:9em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:.8rem}.camname input{width:100%;font:inherit;font-size:.85rem;border:0;border-radius:99px;padding:5px 12px;background:rgba(255,255,255,.85)}
.tabs button{font-size:1rem;padding:12px 18px;flex:1;max-width:240px}
.seebig{display:block;width:100%;margin:6px 0 14px;font:inherit;font-size:1.15rem;font-weight:700;padding:15px;border-radius:16px;border:2px solid var(--dusty);background:var(--card);color:var(--dusty);cursor:pointer}
.ph .dl{position:absolute;top:4px;right:4px;bottom:auto;left:auto;font-size:.75rem;font-weight:700;background:var(--dusty);color:#fff;padding:5px 9px}
.lb .row{display:flex;gap:10px;margin-top:10px}.lb .row button{font:inherit;font-weight:700;border:0;border-radius:99px;padding:12px 22px;cursor:pointer}.lb .row .d{background:var(--dusty);color:#fff}.lb .row .x{background:#fff;color:var(--ink)}
.gtools{text-align:center;margin:0 0 12px}.gtools button{font:inherit;font-weight:700;border:2px solid var(--dusty);background:var(--card);color:var(--dusty);border-radius:99px;padding:10px 20px;cursor:pointer}
.hint{text-align:center;font-size:.8rem;color:var(--muted);margin:0 0 10px}
</style></head><body><div class="wrap">
<a class="back" href="./">← Back to the guest page</a>
<h1>Share Your Photos</h1><p class="sub">Mike &amp; Erica · December 18</p>
<div class="tabs"><button id="tCam">📸 Camera</button><button id="tGal">🖼 See &amp; Download Photos</button></div>
<div id="camView"><div class="cam" id="cam"><video id="vid" playsinline muted autoplay></video><div class="flash" id="fl"></div>
<div class="camname"><input id="who2" maxlength="60" placeholder="Your name (optional)"/></div><div class="qstat" id="qs">0 uploaded ✓</div>
<button class="cb torch" id="torch" hidden aria-label="Flash">⚡</button><button class="shut" id="shut" aria-label="Take photo"></button><button class="cb flip" id="flip" aria-label="Flip camera">🔄</button></div>
<p class="msg" id="camMsg" style="text-align:center">Tap the circle to take a photo. It uploads right away.</p>
<button class="seebig" id="seeBig">🖼 See &amp; Download everyone’s photos ↓</button></div>
<div id="galView">
<div class="card">
<input class="name" id="who" maxlength="60" placeholder="Your name (optional)"/>
<button class="big" id="add">📷 Add photos</button>
<input type="file" id="file" accept="image/*" multiple hidden/><input type="file" id="fileCap" accept="image/*" capture="environment" hidden/>
<div class="prog" id="prog" hidden><div></div></div><div class="msg" id="msg"></div>
</div>
<h2 id="gallery">Photos from today</h2><p class="hint">Tap a photo to view it full-size. Tap ⬇ to save it.</p><div class="gtools"><button id="dlAll" hidden>⬇ Download all (zip)</button></div><div class="grid" id="grid"></div><p class="msg" id="empty" style="text-align:center"></p>
</div>
<div class="tools"><button id="editBtn">Edit</button> <span id="passBox" hidden><input id="passIn" type="password" placeholder="Passcode"/> <button id="passGo">Unlock</button></span></div>
</div>
<div class="lb" id="lb"><img id="lbImg" alt=""/><p id="lbCap"></p><div class="row"><button class="d" id="lbDl">⬇ Download</button><button class="x" id="lbX">Close</button></div></div>
<script>
const SB="https://pmbehaioxviyhdmmczfl.supabase.co",KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBtYmVoYWlveHZpeWhkbW1jemZsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcxODg4NjAsImV4cCI6MjEwMjc2NDg2MH0.H6u8tZ3lnkeOOfK1bwlQ5OIKkNbLpAmfi7NykSE_vIE",BUCKET="vow-photos",MAX=15*1024*1024;
const H={apikey:KEY,Authorization:"Bearer "+KEY};
const rpc=(f,b)=>fetch(SB+"/rest/v1/rpc/"+f,{method:"POST",headers:{...H,"Content-Type":"application/json"},body:JSON.stringify(b||{})}).then(async r=>{if(!r.ok)throw new Error((await r.json().catch(()=>({}))).message||r.status);const t=await r.text();return t?JSON.parse(t):null});
const $=id=>document.getElementById(id),pub=p=>SB+"/storage/v1/object/public/"+BUCKET+"/"+p;
let pass=localStorage.getItem("vowSeatPass")||"",editing=false;
$("who").value=localStorage.getItem("vowPhotoName")||"";
$("add").onclick=()=>$("file").click();
async function shrink(f){ // resize big photos on the device to ~3000px JPEG
 if(!/^image\/(jpeg|png|webp)$/.test(f.type))return f;
 try{const bm=await createImageBitmap(f);const s=Math.min(1,3000/Math.max(bm.width,bm.height));if(s===1&&f.size<4e6)return f;
  const c=document.createElement("canvas");c.width=Math.round(bm.width*s);c.height=Math.round(bm.height*s);c.getContext("2d").drawImage(bm,0,0,c.width,c.height);
  const b=await new Promise(r=>c.toBlob(r,"image/jpeg",.85));return b&&b.size<f.size?new File([b],"p.jpg",{type:"image/jpeg"}):f}catch(e){return f}}
function put(path,blob,onp){return new Promise((ok,bad)=>{const x=new XMLHttpRequest();x.open("POST",SB+"/storage/v1/object/"+BUCKET+"/"+path);
 for(const k in H)x.setRequestHeader(k,H[k]);x.setRequestHeader("Content-Type",blob.type||"image/jpeg");x.setRequestHeader("x-upsert","false");
 x.upload.onprogress=e=>e.lengthComputable&&onp(e.loaded/e.total);x.onload=()=>x.status<300?ok():bad(new Error(x.responseText||x.status));x.onerror=()=>bad(new Error("network"));x.send(blob)})}
$("file").onchange=async e=>{const files=[...e.target.files].filter(f=>f.type.startsWith("image/")||/\.(hei[cf])$/i.test(f.name));e.target.value="";if(!files.length)return;
 const who=$("who").value.trim();localStorage.setItem("vowPhotoName",who);const bar=$("prog").firstElementChild;$("prog").hidden=false;let ok=0,fail=0;
 for(let i=0;i<files.length;i++){$("msg").textContent=`Uploading ${i+1} of ${files.length}…`;
  try{const f=await shrink(files[i]);if(f.size>MAX)throw new Error("too big");
   const ext=(f.type.split("/")[1]||"jpg").replace("jpeg","jpg"),path="guests/"+Date.now()+"-"+Math.random().toString(36).slice(2,8)+"."+ext;
   await put(path,f,p=>bar.style.width=((i+p)/files.length*100)+"%");await rpc("vow_photo_add",{path,uploader:who});ok++}catch(err){fail++;console.warn(err)}}
 bar.style.width="100%";$("msg").innerHTML=ok?`<div class="thanks">Thank you${who?", "+who.replace(/[<>&]/g,""):""}!</div>${ok} photo${ok>1?"s":""} added${fail?` · ${fail} couldn't upload (photos must be images under 15 MB)`:""}`:"Sorry, those photos couldn't upload. Please try again.";
 setTimeout(()=>$("prog").hidden=true,1500);load()};
async function load(){const L=await rpc("vow_photos_list",{p:editing?pass:null}).catch(()=>[]);shown=L;$("dlAll").hidden=!L.some(x=>!x.hidden);const g=$("grid");g.innerHTML="";$("empty").textContent=L.length?"":"No photos yet. Be the first!";
 L.forEach(x=>{const d=document.createElement("div");d.className="ph"+(x.hidden?" hid":"");const im=document.createElement("img");im.loading="lazy";im.src=pub(x.path);im.alt="Photo"+(x.by?" from "+x.by:"");d.append(im);
  if(x.by){const s=document.createElement("span");s.className="by";s.textContent=x.by;d.append(s)}
  d.onclick=()=>{cur=x;$("lbImg").src=pub(x.path);$("lbCap").textContent=x.by?"From "+x.by:"";$("lb").style.display="flex"};
  const dl=document.createElement("button");dl.className="dl";dl.textContent="⬇ Save";dl.setAttribute("aria-label","Download photo");dl.onclick=ev=>{ev.stopPropagation();download(x)};d.append(dl);
  if(editing){const b=document.createElement("button");b.textContent=x.hidden?"Unhide":"Hide";b.onclick=async ev=>{ev.stopPropagation();await rpc("vow_photo_hide",{p:pass,pid:x.id,h:!x.hidden});load()};d.append(b)}
  g.append(d)})}
let cur=null,shown=[];
$("lb").onclick=e=>{if(e.target.id==="lb"||e.target.id==="lbX"||e.target.id==="lbImg")$("lb").style.display="none"};
$("lbDl").onclick=e=>{e.stopPropagation();cur&&download(cur)};
const fname=x=>"Mike-Erica-Dec18-"+(x.by?x.by.replace(/[^A-Za-z0-9]+/g,"-")+"-":"")+x.id+"."+(x.path.split(".").pop()||"jpg");
async function download(x){const url=pub(x.path),name=fname(x);
 try{const b=await (await fetch(url)).blob();const f=new File([b],name,{type:b.type||"image/jpeg"});
  const mobile=/iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
  if(mobile&&navigator.canShare&&navigator.canShare({files:[f]})){try{await navigator.share({files:[f]});return}catch(e){if(e.name==="AbortError")return}}
  const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=name;document.body.append(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},4000)}
 catch(e){window.open(url,"_blank")}}
$("dlAll").onclick=async()=>{const B=$("dlAll"),list=shown.filter(x=>!x.hidden);if(!list.length)return;B.disabled=true;
 try{if(!window.JSZip)await new Promise((ok,bad)=>{const sc=document.createElement("script");sc.src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js";sc.onload=ok;sc.onerror=bad;document.head.append(sc)});
  const z=new JSZip();let n=0;for(const x of list){B.textContent=`Packing ${++n} of ${list.length}…`;z.file(fname(x),await (await fetch(pub(x.path))).blob())}
  const blob=await z.generateAsync({type:"blob"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="Mike-Erica-Dec18-photos.zip";document.body.append(a);a.click();setTimeout(()=>a.remove(),4000)}
 catch(e){alert("Couldn't build the zip. Please save photos one at a time.")}B.disabled=false;B.textContent="⬇ Download all (zip)"};
async function enter(){editing=true;$("passBox").hidden=true;$("editBtn").textContent="Done editing";load()}
$("editBtn").onclick=async()=>{if(editing){editing=false;$("editBtn").textContent="Edit";return load()}if(pass&&await rpc("vow_seating_check",{p:pass}))return enter();$("passBox").hidden=false;$("passIn").focus()};
$("passGo").onclick=async()=>{const p=$("passIn").value;if(await rpc("vow_seating_check",{p})){pass=p;localStorage.setItem("vowSeatPass",p);enter()}else $("passIn").value="",$("passIn").placeholder="Wrong passcode"};
// ---- camera mode ----
let stream=null,facing="environment",track=null,torchOn=false,done=+localStorage.getItem("vowCamDone")||0,mode=new URLSearchParams(location.search).get("view")==="gallery"?"gal":"cam";
const syncName=v=>{$("who").value=$("who2").value=v;localStorage.setItem("vowPhotoName",v)};$("who2").value=$("who").value;
$("who").oninput=e=>syncName(e.target.value);$("who2").oninput=e=>syncName(e.target.value);
function setMode(m){mode=m;$("camView").hidden=m!=="cam";$("tCam").classList.toggle("on",m==="cam");$("tGal").classList.toggle("on",m!=="cam");
 history.replaceState(null,"",m==="cam"?location.pathname:"?view=gallery#gallery");if(m==="cam")startCam();else{stopCam();}}
$("tCam").onclick=()=>setMode("cam");$("tGal").onclick=()=>{setMode("gal");$("gallery").scrollIntoView({behavior:"smooth"})};$("seeBig").onclick=$("tGal").onclick;
function stopCam(){stream&&stream.getTracks().forEach(t=>t.stop());stream=null}
async function startCam(){stopCam();try{if(!navigator.mediaDevices?.getUserMedia)throw new Error("unsupported");
 stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:facing},width:{ideal:4032},height:{ideal:3024}},audio:false});
 $("vid").srcObject=stream;track=stream.getVideoTracks()[0];$("cam").classList.toggle("mirror",facing==="user");
 const caps=track.getCapabilities?.()||{};$("torch").hidden=!caps.torch;torchOn=false;$("torch").classList.remove("on");$("camMsg").textContent="Tap the circle to take a photo. It uploads right away."}
 catch(e){$("cam").hidden=true;$("camMsg").innerHTML='Camera not available here. <button class="big" id="fb" style="margin-top:10px">📷 Take or choose photos</button>';$("fb").onclick=()=>$("fileCap").click()}}
$("fileCap").onchange=e=>{$("file").onchange({target:e.target})};
$("flip").onclick=()=>{facing=facing==="user"?"environment":"user";startCam()};
$("torch").onclick=async()=>{torchOn=!torchOn;try{await track.applyConstraints({advanced:[{torch:torchOn}]});$("torch").classList.toggle("on",torchOn)}catch(e){torchOn=false}};
// offline-safe queue in IndexedDB
const idb=new Promise((ok,bad)=>{const q=indexedDB.open("vowCam",1);q.onupgradeneeded=()=>q.result.createObjectStore("q",{keyPath:"id",autoIncrement:true});q.onsuccess=()=>ok(q.result);q.onerror=bad});
const tx=async(m,f)=>{const d=await idb;return new Promise((ok,bad)=>{const t=d.transaction("q",m),st=t.objectStore("q"),r=f(st);t.oncomplete=()=>ok(r&&r.result);t.onerror=bad})};
let pending=0,busy=false;const qs=()=>$("qs").textContent=done+" uploaded ✓"+(pending?" · "+pending+" waiting":"");
async function drain(){if(busy)return;busy=true;try{const items=await tx("readonly",s=>s.getAll());pending=items.length;qs();
 for(const it of items){try{const path="guests/"+it.ts+"-"+Math.random().toString(36).slice(2,8)+".jpg";await put(path,it.blob,()=>{});await rpc("vow_photo_add",{path,uploader:it.who});
  await tx("readwrite",s=>s.delete(it.id));done++;localStorage.setItem("vowCamDone",done);pending--;qs()}catch(e){break}}}finally{busy=false}if(pending)setTimeout(drain,8000);else load()}
addEventListener("online",drain);
$("shut").onclick=async()=>{const v=$("vid");if(!v.videoWidth)return;const s=Math.min(1,3000/Math.max(v.videoWidth,v.videoHeight)),c=document.createElement("canvas");
 c.width=Math.round(v.videoWidth*s);c.height=Math.round(v.videoHeight*s);const g=c.getContext("2d");if(facing==="user"){g.translate(c.width,0);g.scale(-1,1)}g.drawImage(v,0,0,c.width,c.height);
 $("fl").style.opacity=.9;setTimeout(()=>$("fl").style.opacity=0,120);navigator.vibrate?.(30);
 const blob=await new Promise(r=>c.toBlob(r,"image/jpeg",.88));await tx("readwrite",s=>s.add({blob,who:$("who").value.trim(),ts:Date.now()}));pending++;qs();drain()};
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
setMode(mode);if(mode==="gal"||location.hash==="#gallery")setTimeout(()=>$("gallery").scrollIntoView(),400);drain();qs();
load();setInterval(()=>{if(!editing)load()},30000);
</script></body></html>
