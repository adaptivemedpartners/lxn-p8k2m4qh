 stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:facing},width:{ideal:4096},height:{ideal:3072}},audio:false});
 $("vid").srcObject=stream;track=stream.getVideoTracks()[0];$("cam").classList.toggle("mirror",facing==="user");
 caps=track.getCapabilities?.()||{};$("torch").hidden=!caps.torch;torchOn=false;$("torch").classList.remove("on");
 // ask for the sensor's max resolution when the browser exposes it
 if(caps.width?.max&&caps.height?.max){try{await track.applyConstraints({width:{ideal:caps.width.max},height:{ideal:caps.height.max}})}catch(e){}}
 hwZoom=!!caps.zoom;zMin=hwZoom?caps.zoom.min:1;zMax=hwZoom?Math.min(caps.zoom.max,10):4;zoom=hwZoom?Math.max(zMin,Math.min(1,zMax)):1;setZoom(zoom,true);zoomButtons();
 $("camMsg").textContent="Tap the circle to take a photo. It uploads right away."}
 catch(e){$("cam").hidden=true;$("camMsg").innerHTML='Camera not available here. <button class="big" id="fb" style="margin-top:10px">📷 Take or choose photos</button>';$("fb").onclick=()=>$("fileCap").click()}}
function zoomButtons(){const z=$("zbar");z.innerHTML="";[.5,1,2,3,5].filter(l=>l>=zMin-1e-6&&l<=zMax+1e-6).forEach(l=>{const bt=document.createElement("button");bt.textContent=(l<1?".5":l)+"×";bt.dataset.z=l;bt.onclick=()=>setZoom(l);z.append(bt)});markZoom()}
function markZoom(){[...$("zbar").children].forEach(bt=>bt.classList.toggle("on",Math.abs(+bt.dataset.z-zoom)<.05))}
async function setZoom(v,quiet){zoom=Math.max(zMin,Math.min(zMax,v));
 if(hwZoom){try{await track.applyConstraints({advanced:[{zoom}]})}catch(e){}$("vid").style.transform=""}
 else $("vid").style.transform="scale("+zoom+")";
 markZoom();if(!quiet){$("zlab").textContent=zoom.toFixed(1)+"×";$("zlab").style.opacity=1;clearTimeout(zTimer);zTimer=setTimeout(()=>$("zlab").style.opacity=0,900)}}
// pinch to zoom
let pinch=null;const dist=t=>Math.hypot(t[0].clientX-t[1].clientX,t[0].clientY-t[1].clientY);
$("vid").addEventListener("touchstart",e=>{if(e.touches.length===2){pinch={d:dist(e.touches),z:zoom};e.preventDefault()}},{passive:false});
$("vid").addEventListener("touchmove",e=>{if(pinch&&e.touches.length===2){e.preventDefault();setZoom(pinch.z*dist(e.touches)/pinch.d)}},{passive:false});
$("vid").addEventListener("touchend",e=>{if(e.touches.length<2)setTimeout(()=>pinch=null,50)});
// tap to focus (where the camera supports points of interest)
$("vid").addEventListener("click",async e=>{if(pinch)return;const rc=$("vid").getBoundingClientRect();let x=(e.clientX-rc.left)/rc.width,y=(e.clientY-rc.top)/rc.height;if(facing==="user")x=1-x;
 const f=$("foc");f.style.left=(e.clientX-rc.left)+"px";f.style.top=(e.clientY-rc.top)+"px";f.style.opacity=1;setTimeout(()=>f.style.opacity=0,800);
 const adv={};if(caps.pointsOfInterest!==undefined||"pointsOfInterest" in (track.getSettings?.()||{}))adv.pointsOfInterest=[{x,y}];
 const fm=caps.focusMode||[];if(fm.includes("single-shot"))adv.focusMode="single-shot";else if(fm.includes("continuous"))adv.focusMode="continuous";
 if(caps.exposureMode?.includes("continuous"))adv.exposureMode="continuous";
 if(Object.keys(adv).length){try{await track.applyConstraints({advanced:[adv]})}catch(err){}}});
$("fileCap").onchange=e=>{$("file").onchange({target:e.target})};
$("flip").onclick=()=>{facing=facing==="user"?"environment":"user";startCam()};
$("torch").onclick=async()=>{torchOn=!torchOn;try{await track.applyConstraints({advanced:[{torch:torchOn}]});$("torch").classList.toggle("on",torchOn)}catch(e){torchOn=false}};
// offline-safe queue in IndexedDB
const idb=new Promise((ok,bad)=>{const q=indexedDB.open("vowCam",1);q.onupgradeneeded=()=>q.result.createObjectStore("q",{keyPath:"id",autoIncrement:true});q.onsuccess=()=>ok(q.result);q.onerror=bad});
const tx=async(m,f)=>{const d=await idb;return new Promise((ok,bad)=>{const t=d.transaction("q",m),st=t.objectStore("q"),r=f(st);t.oncomplete=()=>ok(r&&r.result);t.onerror=bad})};
let pending=0,busy=false;const qs=()=>$("qs").textContent=done+" uploaded ✓"+(pending?" · "+pending+" waiting":"");
async function drain(){if(busy)return;busy=true;try{const items=await tx("readonly",s=>s.getAll());pending=items.length;qs();
 for(const it of items){try{const path="guests/"+it.ts+"-"+Math.random().toString(36).slice(2,8)+".jpg";await put(path,it.blob,()=>{});await rpc("vow_photo_add",{path,uploader:it.who,tags:it.tags||[]});
  await tx("readwrite",s=>s.delete(it.id));done++;localStorage.setItem("vowCamDone",done);pending--;qs()}catch(e){break}}}finally{busy=false}if(pending)setTimeout(drain,8000);else load()}
addEventListener("online",drain);
async function grab(){const v=$("vid");
 // Full sensor photo where supported (Android Chrome), unless digital zoom is on
 if(window.ImageCapture&&(hwZoom||zoom<=1.01)){try{const ic=new ImageCapture(track);const o={};if(torchOn&&(await ic.getPhotoCapabilities()).fillLightMode?.includes("flash"))o.fillLightMode="flash";
   const bl=await ic.takePhoto(o);if(bl&&bl.size>0&&bl.size<14.5*1024*1024)return bl}catch(e){}}
 // Otherwise: full-resolution video frame, upright as shown, with digital zoom cropped in
 const W=v.videoWidth,H=v.videoHeight,z=hwZoom?1:zoom,cw=W/z,ch=H/z,c=document.createElement("canvas");c.width=Math.round(cw);c.height=Math.round(ch);
 c.getContext("2d").drawImage(v,(W-cw)/2,(H-ch)/2,cw,ch,0,0,c.width,c.height);
 let q=.92,bl=await new Promise(r=>c.toBlob(r,"image/jpeg",q));while(bl&&bl.size>14.5*1024*1024&&q>.5){q-=.15;bl=await new Promise(r=>c.toBlob(r,"image/jpeg",q))}return bl}
$("shut").onclick=async()=>{if(!$("vid").videoWidth)return;$("fl").style.opacity=.9;setTimeout(()=>$("fl").style.opacity=0,120);navigator.vibrate?.(30);
 const blob=await grab();if(!blob)return;await tx("readwrite",s=>s.add({blob,who:$("who").value.trim(),tags:camTags.slice(),ts:Date.now()}));pending++;qs();drain()};
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
setMode(mode);if(mode==="gal"||location.hash==="#gallery")setTimeout(()=>$("gallery").scrollIntoView(),400);drain();qs();
load();setInterval(()=>{if(!editing)load()},30000);
</script><script src="assets/photo-fab.js"></script>
